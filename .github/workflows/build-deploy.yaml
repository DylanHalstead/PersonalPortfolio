name: Deploy to Self-Hosted Runner

on:
  push:
    tags:
      - 'v*'
    branches:
      - lighthouse

jobs:
  # TODO: on failure, make sure old version of the container is "resumed"
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.yml down || true
          echo "Stopped any existing containers"

      - name: Build and deploy new container
        run: |
          docker compose -f docker-compose.yml up --build -d
          echo "New container built and deployed successfully"

      - name: Verify deployment
        run: |
          docker ps
          docker compose ps
          echo "Container is running and accessible on port 8080"

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    # if: needs.deploy.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        id: lighthouse
        with:
          configPath: './lighthouserc.json'
      - name: Read output
        run: |
          echo "${{ steps.lighthouse.outputs.manifest }}"