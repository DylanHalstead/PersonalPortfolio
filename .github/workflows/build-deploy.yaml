name: Deploy to Self-Hosted Runner

on:
  push:
    tags:
      - 'v*'
    branches:
      - lighthouse

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.yml down || true
          echo "Stopped any existing containers"

      - name: Build and deploy new container
        run: |
          docker compose -f docker-compose.yml up --build -d
          echo "New container built and deployed successfully"

      - name: Verify deployment
        run: |
          docker ps
          docker compose ps
          echo "Container is running and accessible on port 8080"

  lighthouseci:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm i -g @lhci/cli@0.15.x
      - run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      